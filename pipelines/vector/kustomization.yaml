apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: pipeline
resources:
  - pvc.yaml
  - deployment.yaml
configMapGenerator:
  - name: vector-config
    files:
      - vector.toml
  - name: vector-rate-profile
    envs:
      - rates/smoke.env
generatorOptions:
  disableNameSuffixHash: true
