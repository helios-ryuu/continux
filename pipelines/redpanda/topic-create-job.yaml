apiVersion: batch/v1
kind: Job
metadata:
  name: redpanda-topic-bootstrap
  namespace: redpanda
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: redpanda-topic-bootstrap
    spec:
      restartPolicy: OnFailure
      nodeSelector:
        role: data-plane
      containers:
        - name: rpk
          image: redpandadata/redpanda:v26.1.1
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              BROKERS="redpanda.redpanda.svc.cluster.local:9093"

              echo "Checking Redpanda topic nyc-taxi-events on ${BROKERS}"
              if rpk topic list --brokers "${BROKERS}" | grep -F "nyc-taxi-events"; then
                echo "Topic nyc-taxi-events already exists"
              else
                echo "Creating topic nyc-taxi-events"
                rpk topic create nyc-taxi-events \
                  --brokers "${BROKERS}" \
                  --partitions 3 \
                  --replicas 1 \
                  --topic-config retention.ms=86400000 \
                  --topic-config cleanup.policy=delete
              fi

              echo "Topic details:"
              rpk topic describe nyc-taxi-events --brokers "${BROKERS}"
