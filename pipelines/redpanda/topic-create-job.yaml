apiVersion: batch/v1
kind: Job
metadata:
  name: redpanda-topic-bootstrap
  namespace: redpanda
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: redpanda-topic-bootstrap
    spec:
      restartPolicy: OnFailure
      nodeSelector:
        role: data-plane
      containers:
        - name: rpk
          image: redpandadata/redpanda:v26.1.9
          envFrom:
            - configMapRef:
                name: redpanda-topic-config
          resources:
            requests: { cpu: 25m, memory: 64Mi }
            limits:   { cpu: 200m, memory: 128Mi }
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              echo "Đang kiểm tra topic Redpanda ${TOPIC_NAME} trên ${BROKERS}"
              if rpk topic list --brokers "${BROKERS}" | grep -F "${TOPIC_NAME}"; then
                echo "Topic ${TOPIC_NAME} đã tồn tại"
              else
                echo "Đang tạo topic ${TOPIC_NAME}"
                rpk topic create "${TOPIC_NAME}" \
                  --brokers "${BROKERS}" \
                  --partitions "${TOPIC_PARTITIONS}" \
                  --replicas "${TOPIC_REPLICAS}" \
                  --topic-config "retention.ms=${TOPIC_RETENTION_MS}" \
                  --topic-config "cleanup.policy=${TOPIC_CLEANUP_POLICY}"
              fi

              echo "Chi tiết topic:"
              rpk topic describe "${TOPIC_NAME}" --brokers "${BROKERS}"
