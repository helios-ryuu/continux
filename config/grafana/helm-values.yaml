adminUser: admin
# adminPassword intentionally omitted. The Grafana Helm chart generates it
# into secret/grafana key admin-password; see docs/SETUP.md §9.3.

deploymentStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 0
    maxUnavailable: 1

initChownData:
  enabled: false

securityContext:
  runAsUser: 472
  runAsGroup: 472
  fsGroup: 472

nodeSelector: { role: control-plane }
tolerations:
  - { key: dedicated, operator: Equal, value: edge, effect: NoSchedule }

resources:
  requests: { memory: 128Mi, cpu: 50m }
  limits:   { memory: 256Mi, cpu: 300m }

persistence:
  enabled: true
  size: 2Gi

datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: VictoriaMetrics
        type: prometheus
        url: http://vmsingle-victoria-metrics.observability.svc.cluster.local:8429
        isDefault: true

dashboardProviders:
  dashboardproviders.yaml:
    apiVersion: 1
    providers:
      - name: default
        folder: Continux
        type: file
        options: { path: /var/lib/grafana/dashboards/default }
