fullnameOverride: victoria-metrics

grafana:
  enabled: false

vmsingle:
  enabled: true
  spec:
    image:
      tag: v1.143.0
    retentionPeriod: "7d"
    storage:
      accessModes: ["ReadWriteOnce"]
      resources: { requests: { storage: 10Gi } }
    resources:
      requests: { memory: 256Mi, cpu: 100m }
      limits:   { memory: 512Mi, cpu: 500m }
    nodeSelector: { role: control-plane }
    tolerations:
      - { key: dedicated, operator: Equal, value: edge, effect: NoSchedule }

vmagent:
  enabled: true
  spec:
    image:
      tag: v1.143.0
    nodeSelector: { role: control-plane }
    tolerations:
      - { key: dedicated, operator: Equal, value: edge, effect: NoSchedule }
    remoteWrite:
      - url: http://vmsingle-victoria-metrics.observability.svc.cluster.local:8428/api/v1/write
