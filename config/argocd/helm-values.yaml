# Helm chart: argo/argo-cd 9.5.14
# App version: Argo CD v3.4.2
# Profile: single-node lightweight install for continux-vps.

global:
  image:
    tag: v3.4.2
  nodeSelector: { role: control-plane }
  tolerations:
    - { key: dedicated, operator: Equal, value: edge, effect: NoSchedule }

controller:
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 512Mi }

repoServer:
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 384Mi }

server:
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 256Mi }

redis:
  resources:
    requests: { cpu: 25m, memory: 64Mi }
    limits: { memory: 128Mi }

dex:
  enabled: false

applicationSet:
  resources:
    requests: { cpu: 25m, memory: 64Mi }
    limits: { memory: 128Mi }

notifications:
  enabled: false

configs:
  params:
    server.insecure: "true"
