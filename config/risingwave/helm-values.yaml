metaStore:
  sqlite:
    enabled: true

stateStore:
  dataDirectory: hummock001
  s3:
    enabled: true
    endpoint: http://minio.minio.svc.cluster.local:9000
    bucket:   rw-checkpoint
    region:   us-east-1
    forcePathStyle: true
    authentication:
      existingSecretName: risingwave-s3-credentials

iceberg:
  catalog:
    type: hosted

computeComponent:
  replicas: 1
  nodeSelector: { role: data-plane }
  resources:
    requests: { cpu: 500m, memory: 1.5Gi }
    limits:   { cpu: 2,    memory: 2.5Gi }

metaComponent:
  replicas: 1
  nodeSelector: { role: data-plane }
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits:   { cpu: 500m, memory: 512Mi }

frontendComponent:
  replicas: 1
  nodeSelector: { role: data-plane }
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits:   { cpu: 500m, memory: 512Mi }

compactorComponent:
  replicas: 1
  nodeSelector: { role: data-plane }
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits:   { cpu: 500m, memory: 512Mi }
