apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: continux-metrics
  namespace: observability
spec:
  selector:
    matchLabels:
      app: continux-metrics
  namespaceSelector:
    matchNames: [pipeline]
  endpoints:
    - port: metrics
      path: /metrics
      interval: 15s
