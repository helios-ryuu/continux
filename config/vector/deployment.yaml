apiVersion: apps/v1
kind: Deployment
metadata:
  name: vector
  namespace: pipeline
spec:
  replicas: 0
  selector:
    matchLabels: { app: vector }
  template:
    metadata:
      labels: { app: vector }
    spec:
      nodeSelector: { role: data-plane }
      containers:
        - name: vector
          image: timberio/vector:0.45.0-alpine
          args: ["--config", "/etc/vector/vector.toml"]
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits:   { cpu: 500m, memory: 1Gi }
          volumeMounts:
            - name: config
              mountPath: /etc/vector
            - name: data
              mountPath: /data
            - name: vector-state
              mountPath: /var/lib/vector
      volumes:
        - name: config
          configMap:
            name: vector-config
        - name: data
          persistentVolumeClaim:
            claimName: vector-data
        - name: vector-state
          emptyDir:
            sizeLimit: 1Gi
