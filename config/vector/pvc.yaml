apiVersion: v1
kind: PersistentVolume
metadata:
  name: vector-data-pv
spec:
  capacity:
    storage: 10Gi
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  hostPath:
    path: /home/helios/continux/data/raw
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values: [imac]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vector-data
  namespace: pipeline
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 10Gi
  volumeName: vector-data-pv
